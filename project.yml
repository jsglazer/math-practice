# XcodeGen spec — source of truth for MathPractice.xcodeproj.
#
# The domain logic lives in the SwiftPM package (Package.swift) as MathPracticeCore; these
# app targets compile only the SwiftUI/SwiftData/WebKit shell and link that library, so
# `import MathPracticeCore` resolves to the same module the headless test suite builds
# against. `swift test` never needs these targets. Regenerate with:  xcodegen generate
name: MathPractice
options:
  bundleIdPrefix: com.jsglazer
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.8"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "PWGXN26URQ"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  MathPracticeCore:
    path: .

targets:
  MathPractice:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      # PDF export is macOS-only, so the iOS installer stub is excluded here.
      - path: Sources/MathPracticeApp
        excludes:
          - "Export/iOS/**"
          - "Resources/**"
      # KaTeX ships as a folder reference so the fonts keep their directory layout.
      - path: Sources/MathPracticeApp/Resources/katex
        type: folder
        buildPhase: resources
    dependencies:
      - package: MathPracticeCore
        product: MathPracticeCore
    settings:
      base:
        PRODUCT_NAME: MathPractice
        PRODUCT_BUNDLE_IDENTIFIER: com.jsglazer.MathPractice
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MathPractice
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Josh Glazer"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MathPractice.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MathPractice-iOS:
    name: MathPractice-iOS
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # NOTE FOR REVIEW: `Export/macOS/**` is excluded, so MacWorksheetExporter — the only
      # WorksheetExporting conformance — does not compile into the iOS target at all.
      - path: Sources/MathPracticeApp
        excludes:
          - "Export/macOS/**"
          - "Resources/**"
      - path: Sources/MathPracticeApp/Resources/katex
        type: folder
        buildPhase: resources
    dependencies:
      - package: MathPracticeCore
        product: MathPracticeCore
    settings:
      base:
        PRODUCT_NAME: MathPractice
        PRODUCT_BUNDLE_IDENTIFIER: com.jsglazer.MathPractice
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MathPractice
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Josh Glazer"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MathPractice-iOS.entitlements
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
