# SwiftLint configuration for MathPractice.
included:
  - Sources
  - Tests

excluded:
  - .build
  - Sources/MathPracticeApp/Resources

disabled_rules:
  - todo
  - trailing_comma

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

type_body_length:
  warning: 350
  error: 500

function_body_length:
  warning: 80
  error: 140

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length: 1
  excluded: [a, b, c, d, e, k, m, n, x, u, v, id]

# No force-unwraps in committed logic. Test fixtures use known-good literals.
force_unwrapping:
  severity: error

force_cast:
  severity: error

force_try:
  severity: error
